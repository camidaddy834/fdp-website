# Netlify build configuration for the FDP Astro site
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Serverless functions (proposal form handler lives here)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Clean URL for the proposal form — proxied to the function (200 = rewrite)
[[redirects]]
  from = "/api/proposal"
  to = "/.netlify/functions/proposal"
  status = 200

# Long-cache immutable build assets (Astro fingerprints these)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sensible security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
