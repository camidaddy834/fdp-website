<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep the editor out of search results. -->
    <meta name="robots" content="noindex" />
    <title>FDP Content Manager</title>
  </head>
  <body>
    <!--
      Sveltia CMS — the browser-based editor for FDP staff.
      It automatically loads ./config.yml from this same /admin/ folder.
      This whole folder lives in public/, which Astro copies verbatim, so the
      editor is served at https://fdp.org/admin/ with no build step of its own.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
